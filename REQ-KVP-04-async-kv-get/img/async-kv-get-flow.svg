<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">DeepInfer asynchronous prefix KV get sequence</title>
  <desc id="desc">A sequence diagram showing the Scheduler continuing other work while a Python worker asynchronously gets prefix KV blocks from Mooncake Store.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker>
    <marker id="async-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bf8700"/></marker>
    <style>
      .title { font: 600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #1f2328; }
      .label { font: 600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #1f2328; }
      .text { font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #424a53; }
      .small { font: 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #57606a; }
      .participant { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; rx: 8; }
      .syncbox { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; rx: 8; }
      .asyncbox { fill: #fff8c5; stroke: #bf8700; stroke-width: 1.5; rx: 8; }
      .successbox { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; rx: 8; }
      .life { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .sync { stroke: #57606a; stroke-width: 2; marker-end: url(#arrow); }
      .async { stroke: #bf8700; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#async-arrow); }
    </style>
  </defs>
  <rect width="1280" height="760" fill="#fff"/>
  <text x="48" y="42" class="title">DeepInfer 阶段一异步 KV Get 时序</text>
  <text x="48" y="68" class="small">黄色虚线表示后台异步路径；Scheduler 不等待 Store 返回，继续处理其他请求。</text>
  <rect x="830" y="18" width="410" height="56" class="asyncbox"/>
  <text x="850" y="42" class="label">队列：waiting · kv_loading · kv_ready</text>
  <text x="850" y="61" class="small">kv_ready 为优先持有队列；kv_loading 不参与模型调度</text>

  <rect x="52" y="96" width="190" height="54" class="participant"/><text x="147" y="129" text-anchor="middle" class="label">上游命中结果</text>
  <rect x="330" y="96" width="190" height="54" class="participant"/><text x="425" y="129" text-anchor="middle" class="label">DeepInfer Scheduler</text>
  <rect x="608" y="96" width="190" height="54" class="participant"/><text x="703" y="129" text-anchor="middle" class="label">Python KV Worker</text>
  <rect x="886" y="96" width="190" height="54" class="participant"/><text x="981" y="129" text-anchor="middle" class="label">Mooncake Store</text>
  <rect x="1100" y="96" width="140" height="54" class="participant"/><text x="1170" y="129" text-anchor="middle" class="label">其他请求</text>

  <line x1="147" y1="150" x2="147" y2="700" class="life"/><line x1="425" y1="150" x2="425" y2="700" class="life"/>
  <line x1="703" y1="150" x2="703" y2="700" class="life"/><line x1="981" y1="150" x2="981" y2="700" class="life"/><line x1="1170" y1="150" x2="1170" y2="700" class="life"/>

  <line x1="147" y1="190" x2="425" y2="190" class="sync"/><text x="286" y="181" text-anchor="middle" class="text">命中 token 数</text>
  <rect x="345" y="215" width="160" height="38" class="syncbox"/><text x="425" y="239" text-anchor="middle" class="text">进入 waiting</text>
  <rect x="330" y="265" width="190" height="42" class="syncbox"/><text x="425" y="291" text-anchor="middle" class="text">分配 prefix block</text>
  <line x1="425" y1="330" x2="703" y2="330" class="async"/><text x="564" y="320" text-anchor="middle" class="text" fill="#9a6700">提交 KVLoadTask</text>
  <rect x="345" y="350" width="160" height="40" class="asyncbox"/><text x="425" y="375" text-anchor="middle" class="text">kv_loading</text>

  <line x1="703" y1="420" x2="981" y2="420" class="async"/><text x="842" y="410" text-anchor="middle" class="text" fill="#9a6700">后台 get(block items)</text>
  <rect x="608" y="440" width="190" height="46" class="asyncbox"/><text x="703" y="468" text-anchor="middle" class="text">生成 key，写入 HBM</text>
  <rect x="1100" y="350" width="140" height="74" class="syncbox"/><text x="1170" y="378" text-anchor="middle" class="text">Scheduler 继续</text><text x="1170" y="398" text-anchor="middle" class="small">其他 Prefill / Decode</text>
  <line x1="425" y1="370" x2="1170" y2="370" class="sync"/><text x="798" y="360" text-anchor="middle" class="small">不等待 Store 返回</text>

  <line x1="981" y1="525" x2="703" y2="525" class="async"/><text x="842" y="515" text-anchor="middle" class="text" fill="#9a6700">逐 block completion</text>
  <line x1="703" y1="575" x2="425" y2="575" class="sync"/><text x="564" y="565" text-anchor="middle" class="text">下一轮 step poll</text>
  <rect x="330" y="595" width="190" height="46" class="successbox"/><text x="425" y="623" text-anchor="middle" class="text">kv_ready（优先队列）</text>
  <rect x="330" y="650" width="190" height="42" class="successbox"/><text x="425" y="676" text-anchor="middle" class="text">suffix Prefill</text>

  <line x1="52" y1="725" x2="92" y2="725" class="sync"/><text x="104" y="730" class="small">Scheduler 主线程</text>
  <line x1="300" y1="725" x2="340" y2="725" class="async"/><text x="352" y="730" class="small">Worker / Store 异步路径</text>
</svg>
