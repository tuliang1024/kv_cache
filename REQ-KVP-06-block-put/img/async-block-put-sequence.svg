<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <style>
    .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}
    .head{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}
    .text{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}
    .small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57606a}
    .lane{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
    .life{stroke:#8c959f;stroke-width:1;stroke-dasharray:4 5}
    .box{fill:#fff;stroke:#57606a;stroke-width:1.2;rx:6}
    .blue{fill:#ddf4ff;stroke:#54aeff}
    .yellow{fill:#fff8c5;stroke:#d4a72c}
    .green{fill:#dafbe1;stroke:#1a7f37}
    .line{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    .async{stroke:#8250df;stroke-width:1.5;fill:none;stroke-dasharray:7 5;marker-end:url(#arrowPurple)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#57606a"/></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8250df"/></marker>
  </defs>
  <text x="32" y="34" class="title">异步 Block Put 时序</text>
  <text x="32" y="58" class="small">时间自上向下；实线为 Engine 主线程调用，紫色虚线为 worker 后台操作和 completion。</text>

  <rect x="24" y="82" width="220" height="700" class="lane"/>
  <rect x="260" y="82" width="210" height="700" class="lane"/>
  <rect x="486" y="82" width="220" height="700" class="lane"/>
  <rect x="722" y="82" width="220" height="700" class="lane"/>
  <rect x="958" y="82" width="298" height="700" class="lane"/>
  <text x="98" y="112" class="head">LLMEngine</text>
  <text x="326" y="112" class="head">Scheduler</text>
  <text x="548" y="112" class="head">BlockManager</text>
  <text x="783" y="112" class="head">KVPoolWorker</text>
  <text x="1054" y="112" class="head">Mooncake Store</text>
  <path d="M134 128 L134 760" class="life"/>
  <path d="M365 128 L365 760" class="life"/>
  <path d="M596 128 L596 760" class="life"/>
  <path d="M832 128 L832 760" class="life"/>
  <path d="M1107 128 L1107 760" class="life"/>

  <rect x="48" y="150" width="172" height="48" class="box blue"/>
  <text x="60" y="171" class="text">确定完整 block</text>
  <text x="60" y="189" class="text">Prefill 完成 / Decode 满块</text>
  <path d="M134 198 L134 226" class="line"/>
  <rect x="48" y="226" width="172" height="48" class="box"/>
  <text x="60" y="247" class="text">复制 block_ids</text>
  <text x="60" y="265" class="text">构造 PutTask</text>

  <path d="M220 250 L510 250" class="line"/>
  <rect x="510" y="226" width="172" height="48" class="box yellow"/>
  <text x="522" y="247" class="text">pin_blocks(block_ids)</text>
  <text x="522" y="265" class="text">增加 Put 引用</text>
  <path d="M134 274 L134 298 L748 298" class="line"/>
  <rect x="748" y="274" width="168" height="48" class="box"/>
  <text x="760" y="295" class="text">submit_put(task)</text>
  <text x="760" y="313" class="text">进入后台队列</text>

  <path d="M832 322 L832 370" class="async"/>
  <rect x="748" y="370" width="168" height="48" class="box yellow"/>
  <text x="760" y="391" class="text">等待 ready_event</text>
  <text x="760" y="409" class="text">准备 HBM buffer</text>
  <path d="M916 394 L1018 394" class="async"/>
  <rect x="1018" y="370" width="178" height="48" class="box yellow"/>
  <text x="1030" y="391" class="text">Store.put(items)</text>
  <text x="1030" y="409" class="text">写入完整 block</text>

  <rect x="48" y="470" width="172" height="48" class="box blue"/>
  <text x="60" y="491" class="text">继续下一次 step</text>
  <text x="60" y="509" class="text">调用 Scheduler</text>
  <path d="M220 494 L274 494" class="line"/>
  <rect x="274" y="470" width="172" height="48" class="box blue"/>
  <text x="286" y="491" class="text">Scheduler.schedule()</text>
  <text x="286" y="509" class="text">调度其他可执行请求</text>
  <path d="M134 518 L134 548" class="line"/>
  <rect x="48" y="548" width="172" height="48" class="box green"/>
  <text x="60" y="569" class="text">poll completion</text>
  <text x="60" y="587" class="text">校验 task_id / 结果</text>

  <path d="M1107 418 L1107 450 L832 450" class="async"/>
  <path d="M832 450 L832 520 L220 520 L220 572" class="async"/>
  <text x="730" y="442" class="small">worker 写入 completion 队列</text>
  <path d="M220 572 L510 572" class="line"/>
  <rect x="510" y="548" width="172" height="48" class="box green"/>
  <text x="522" y="569" class="text">unpin_blocks(block_ids)</text>
  <text x="522" y="587" class="text">释放 Put 引用</text>
  <path d="M510 572 L446 572 L446 628" class="line"/>
  <rect x="274" y="628" width="172" height="48" class="box"/>
  <text x="286" y="649" class="text">记录成功 / 失败</text>
  <text x="286" y="667" class="text">失败不阻塞推理</text>
  <text x="32" y="752" class="small">未满 block 保留在请求尾部；后续 Decode 填满后重新进入同一 Put 流程。</text>
</svg>
